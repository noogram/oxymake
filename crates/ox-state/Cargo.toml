[package]
name = "ox-state"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite persistence layer — sessions, build history, schema migrations"

[dependencies]
ox-core = { path = "../ox-core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

# gethostname(3) for the audit trail's host column (#12); also used by the
# fault-injection tests to SIGKILL a child.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true
